receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus:
    config:
      # This is a simple scrape config that discovers targets via static_config.
      # You can add more scrape_configs or use file/service discovery as needed.
      scrape_configs:
        - job_name: "otel-collector"
          static_configs:
            - targets: ["127.0.0.1:8889"]

processors:
  batch:
    timeout: 10s
  memory_limiter:
    # Prevent unbounded memory growth in the collector
    limit_mib: 400
    spike_limit_mib: 100
    check_interval: 5s
  attributes:
    # Example: remove noisy attributes or rename things. Adapt as needed.
    actions:
      - key: "http.user_agent"
        action: delete

exporters:
  debug: {}

  prometheus:
    # Exposes a Prometheus metrics endpoint for scraped metrics from pipelines.
    endpoint: "0.0.0.0:8889"

  # Uncomment and configure if you want to forward to another OTLP collector/backend
  # otlp:
  #   endpoint: "backend-collector:4317"
  #   tls:
  #     insecure: true

extensions:
  health_check: {}
  pprof:
    endpoint: 0.0.0.0:1777
  zpages: {}

service:
  extensions: [health_check, pprof, zpages]

  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, memory_limiter]
      exporters: [debug]
    metrics:
      receivers: [otlp, prometheus]
      processors: [batch, memory_limiter]
      exporters: [prometheus, debug]
